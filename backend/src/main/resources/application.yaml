spring:
  application:
    name: backend
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

  datasource:
    url: jdbc:mysql://localhost:3306/${MYSQL_DATABASE}?connectionTimeZone=Asia/Tokyo&forceConnectionTimeZoneToSession=true
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}

mybatis:
  configuration:
    map-underscore-to-camel-case: true