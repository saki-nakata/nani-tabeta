plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.8'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.diffplug.spotless' version '8.10.4'
}

group = 'com.nanitabeta'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:4.0.1'
	//Flyway Migration
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-mysql'

	//Swagger
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'

	//Security
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server-test'

	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:4.0.1'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
	systemProperty 'spring.profiles.active', 'test'
}

// Java の整形（Google スタイルの Eclipse 用 XML。config/README.md に取得元を記録）
spotless {
	java {
		// 対象は Java のファイルだけ（mapper の XML は、下の format 'xml' で別のルールで整形する）
		target 'src/main/java/**/*.java', 'src/test/java/**/*.java'
		// 使っていない import を消す
		removeUnusedImports()
		// import の並び順（Google スタイル：static をまとめて先に、空行 1 行、そのほかをまとめる）
		importOrder('\\#', '')
		// どこで動かしても同じ結果になるよう、Eclipse の版を固定する
		eclipse('4.39').configFile('config/eclipse-java-google-style.xml')
	}
	// mapper の XML の整形（Prettier の XML 用プラグイン。SQL の空白と改行は手で書いたまま残す）
	format 'xml', {
		// 対象は mapper の XML だけ
		target 'src/main/resources/mapper/*.xml'
		// どこで動かしても同じ結果になるよう、版を固定する
		prettier(['prettier': '3.9.9', '@prettier/plugin-xml': '3.4.2']).config([
			'plugins': ['@prettier/plugin-xml'],
			'parser': 'xml',
			'tabWidth': 2,
			'printWidth': 100,
			// タグの中の文字（SQL）の空白と改行を変えない
			'xmlWhitespaceSensitivity': 'preserve'
		])
	}
}
