plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.8'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.diffplug.spotless' version '8.10.4'
}

group = 'com.nanitabeta'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:4.0.1'
	//Flyway Migration
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-mysql'

	//Swagger
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'

	//Security
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server-test'

	//Sudachi（店名・商品名の読みを作る。辞書は下の prepareSudachiDictionary でビルドのときに取ってくる）
	implementation 'com.worksap.nlp:sudachi:0.8.2'

	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:4.0.1'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
	systemProperty 'spring.profiles.active', 'test'
	dependsOn 'prepareSudachiDictionary'
}

tasks.named('bootRun') {
	dependsOn 'prepareSudachiDictionary'
}

// Sudachi の辞書（約 200MB あり Git に入れられないので、ビルドのときに取ってくる）
// 本体（0.8.2）と辞書の形式には互換性があるので、版を変えるときは両方を一緒に確かめる
def sudachiDictionaryVersion = '20261015'
def sudachiDictionaryUrl = "https://sudachi.s3-ap-northeast-1.amazonaws.com/sudachidict/v1/sudachi-dictionary-${sudachiDictionaryVersion}-core.zip"
def sudachiDictionarySha256 = '5cf5cb7f1ea943a988e2fb5d285a9a8b3538861faefa7a2604c2cd18c387f503'
def sudachiDictionaryZip = layout.buildDirectory.file("sudachi/sudachi-dictionary-${sudachiDictionaryVersion}-core.zip")

// 辞書の zip を取ってきて、SHA-256 が上の値と同じかを確かめる
// URL・SHA-256・zip が前と同じなら、Gradle が UP-TO-DATE として飛ばす（2 回目からはダウンロードしない）
tasks.register('downloadSudachiDictionary') {
	inputs.property('url', sudachiDictionaryUrl)
	inputs.property('sha256', sudachiDictionarySha256)
	outputs.file(sudachiDictionaryZip)
	doLast {
		def zipFile = sudachiDictionaryZip.get().asFile
		// まず「.part」の名前で受け取り、SHA-256 が一致したときだけ本来の名前に変える
		// （途中で失敗したものや、一致しなかったものが、本来の名前で残らないように）
		def partFile = new File(zipFile.parentFile, "${zipFile.name}.part")
		zipFile.parentFile.mkdirs()
		def connection = URI.create(sudachiDictionaryUrl).toURL().openConnection()
		// 通信が止まったときに待ち続けないよう、つながるまで 30 秒・受け取りが止まってから 60 秒で失敗にする
		connection.connectTimeout = 30_000
		connection.readTimeout = 60_000
		// 約 77MB を一度にメモリに読まないよう、受け取りながら少しずつ SHA-256 を計算する
		def digest = java.security.MessageDigest.getInstance('SHA-256')
		connection.inputStream.withStream { input ->
			partFile.withOutputStream { output ->
				def buffer = new byte[64 * 1024]
				int length
				while ((length = input.read(buffer)) != -1) {
					digest.update(buffer, 0, length)
					output.write(buffer, 0, length)
				}
			}
		}
		def actualSha256 = digest.digest().encodeHex().toString()
		if (actualSha256 != sudachiDictionarySha256) {
			// 一致しなかったファイルは消さずに .part の名前のまま残す（展開には使われない。次の取得で上書きされる）
			throw new GradleException("Sudachi の辞書の SHA-256 が一致しません: ${actualSha256}（${partFile} は使いません）")
		}
		java.nio.file.Files.move(partFile.toPath(), zipFile.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
	}
}

// zip から辞書本体とライセンスの 2 ファイルだけを取り出し、build/sudachi/sudachi-dictionary-20261015/ に置く
tasks.register('prepareSudachiDictionary', Copy) {
	dependsOn 'downloadSudachiDictionary'
	from(zipTree(sudachiDictionaryZip)) {
		include '*/system_core.dic', '*/LEGAL', '*/LICENSE-2.0.txt'
	}
	into layout.buildDirectory.dir('sudachi')
}

// mapper の XML の整形に使う Prettier の版は、backend/package.json の 1 か所だけに書く（Cursor の保存時の整形と同じ版にするため）
def formatterDependencies = new groovy.json.JsonSlurper()
	.parseText(file('package.json').getText('UTF-8')).devDependencies

// Java の整形（Google スタイルの Eclipse 用 XML。config/README.md に取得元を記録）
spotless {
	java {
		// 対象は Java のファイルだけ（mapper の XML は、下の format 'xml' で別のルールで整形する）
		target 'src/main/java/**/*.java', 'src/test/java/**/*.java'
		// 使っていない import を消す
		removeUnusedImports()
		// import の並び順（Google スタイル：static をまとめて先に、空行 1 行、そのほかをまとめる）
		importOrder('\\#', '')
		// どこで動かしても同じ結果になるよう、Eclipse の版を固定する
		eclipse('4.39').configFile('config/eclipse-java-google-style.xml')
	}
	// mapper の XML の整形（Prettier の XML 用プラグイン。SQL の空白と改行は手で書いたまま残す）
	format 'xml', {
		// 対象は mapper の XML だけ
		target 'src/main/resources/mapper/*.xml'
		// 版は backend/package.json、整形の設定は backend/.prettierrc.json から読む（Cursor の保存時の整形と同じにするため）
		prettier([
			'prettier': formatterDependencies['prettier'],
			'@prettier/plugin-xml': formatterDependencies['@prettier/plugin-xml']
		]).configFile('.prettierrc.json')
	}
}
